[build]
  # Commande de build
  command = "npm run build:production"
  
  # Dossier de publication
  publish = "dist"
  
  # Variables d'environnement
  environment = { NODE_VERSION = "18" }

[build.environment]
  NODE_ENV = "production"
  VITE_APP_NAME = "Kaizen Strategy"
  VITE_APP_VERSION = "1.0.0"

# Configuration PWA et SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers pour PWA et sécurité
[[headers]]
  for = "/*"
  [headers.values]
    # PWA Headers
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Cache Control
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/manifest+json"

# Optimisations pour les assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Compression
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

# Edge functions (optionnel)
[functions]
  directory = "netlify/functions"

# Développement local
[dev]
  command = "npm run dev"
  port = 5173
  publish = "dist"