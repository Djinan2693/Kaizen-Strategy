<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#b00000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kaizen Strategy" />
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Cabinet de conseil spécialisé dans la transformation stratégique et digitale des entreprises. Excellence, innovation et amélioration continue." />
    <meta name="keywords" content="conseil, stratégie, transformation digitale, amélioration continue, kaizen, formation, expertise" />
    <meta name="author" content="Kaizen Strategy" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kaizenstrategy.ci/" />
    <meta property="og:title" content="Kaizen Strategy - Excellence & Innovation" />
    <meta property="og:description" content="Cabinet de conseil spécialisé dans la transformation stratégique et digitale des entreprises" />
    <meta property="og:image" content="/logo.jpg" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://kaizenstrategy.ci/" />
    <meta property="twitter:title" content="Kaizen Strategy - Excellence & Innovation" />
    <meta property="twitter:description" content="Cabinet de conseil spécialisé dans la transformation stratégique et digitale des entreprises" />
    <meta property="twitter:image" content="/logo.jpg" />
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Preload Critical Resources -->
    <link rel="preload" href="/logo.jpg" as="image" />
    <link rel="preload" href="/photo-fondateur.png" as="image" />
    
    <title>Kaizen Strategy - Excellence & Innovation</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      // Enregistrement du service worker.
      // Aucune interception de « beforeinstallprompt » : le navigateur affiche
      // lui-même sa proposition d'installation (icône dans la barre d'adresse).
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').then(
            function (registration) {
              console.log('ServiceWorker enregistré :', registration.scope);
            },
            function (err) {
              console.log("Échec de l'enregistrement du ServiceWorker :", err);
            }
          );
        });
      }

      window.addEventListener('appinstalled', function () {
        console.log('PWA installée');
      });
    </script>
  </body>
</html>
